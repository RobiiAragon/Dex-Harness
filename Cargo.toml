[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-llm",
    "crates/harness-tools",
    "crates/harness-mcp",
    "crates/harness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dex-Harness Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/robii/Dex-Harness"
readme = "README.md"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Networking & HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Serialization & Schemas
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }

# Internal Workspace Crates
harness-core = { path = "crates/harness-core" }
harness-llm = { path = "crates/harness-llm" }
harness-tools = { path = "crates/harness-tools" }
harness-mcp = { path = "crates/harness-mcp" }
