[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-llm",
    "crates/harness-tools",
    "crates/harness-mcp",
    "crates/harness-computer",
    "crates/harness-ui",
    "crates/harness-cli",
    "crates/harness-desktop",
    "crates/harness-models",
    "crates/harness-extensions",
    "crates/harness-audio",
    "crates/harness-docs",
    "crates/harness-media",
    "crates/harness-3d",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Dex-Harness Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/robii/Dex-Harness"
readme = "README.md"

[workspace.dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Networking & HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }

# Audio & Document Parsing
cpal = "0.15"
hound = "3.5"
lopdf = "0.35"

# 3D Geometry Inspection
gltf = "1.4"

# Browser & Desktop Automation
chromiumoxide = { version = "0.8", default-features = false, features = ["tokio-runtime"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
enigo = { version = "0.6", default-features = false }

# TUI & Terminal
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.8"

# Tauri v2 Desktop & Native macOS
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-build = "2.0"
tauri-plugin-global-shortcut = "2.0"

# Hardware & System Info
sysinfo = "0.33"

# Serialization & Schemas
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "0.8"

# Search, Regex & Filesystem
dirs = "7.0"
ignore = "0.4"
regex = "1.11"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Tracing & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }

# Internal Workspace Crates
harness-core = { path = "crates/harness-core" }
harness-llm = { path = "crates/harness-llm" }
harness-tools = { path = "crates/harness-tools" }
harness-mcp = { path = "crates/harness-mcp" }
harness-computer = { path = "crates/harness-computer" }
harness-ui = { path = "crates/harness-ui" }
harness-models = { path = "crates/harness-models" }
harness-extensions = { path = "crates/harness-extensions" }
harness-audio = { path = "crates/harness-audio" }
harness-docs = { path = "crates/harness-docs" }
harness-media = { path = "crates/harness-media" }
harness-3d = { path = "crates/harness-3d" }
